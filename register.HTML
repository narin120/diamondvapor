<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="STYLE.CSS">
</head>
<body>
    <div class="login-box">

        <h1 class="login-type">REGISTER</h1>

        <form id="register-form" class="form">
            <p class="auth-message" id="auth-message" role="status" aria-live="polite"></p>
            <label for="name">First Name :</label>
            <input type="text" id="name" placeholder="First Name" required>

            <label for="last-name">Last Name :</label>
            <input type="text" id="last-name" placeholder="Last Name" required>

            <label for="dob">Date of Birth :</label>
            <input type="date" id="dob" required>

            <label for="gender">Gender :</label>
            <select id="gender" required>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>

            <label for="email">GMAIL :</label>
            <input type="email" id="email" placeholder="user07@gmail.com" autocomplete="email" required>

            <label for="password">PASSWORD :</label>
            <input type="password" id="password" placeholder="strongpw#A07" autocomplete="new-password" required>

            <label for="confirm-password">Confirm PASSWORD :</label>
            <input type="password" id="confirm-password" placeholder="strongpw#A07" autocomplete="new-password" required>

            <div class="save-password">
                <label>
                    <input type="checkbox"> save password
                </label>
                <a href="#" class="forgot-btn">Forgot password ?</a>
            </div>

            <div class="login">
                <button type="submit">Enter</button>
            </div>

            <p class="auth-switch">Already registered? <a href="login.html">Login</a></p>

            <div class="text">
                <label for="msg">Messages</label>
                <textarea id="msg" placeholder="write your message"></textarea>
            </div>
        </form>

    </div>
    <script src="auth.js"></script>
</body>
</html>
